<text x="883" y="1178" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Redis Pub/Sub/WebSocket payload: bounty_id, expert_id, name, team, score, matched_skills[]</text>
