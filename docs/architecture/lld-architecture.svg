<text x="618" y="478" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Reject malformed JSON, empty title, no skills, amount &lt; 1, or TTL &lt; 60</text>
