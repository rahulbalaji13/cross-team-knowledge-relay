<rect x="60" y="1285" width="440" height="9" rx="16" fill="#2563eb"/>
<text x="78" y="1319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Request DTO</text>
<text x="80" y="1347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">• createBountyRequest{title, description, skills[],</text>
<text x="80" y="1365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">  bounty_amount, ttl_seconds, poster_team}</text>
<rect x="535" y="1285" width="440" height="95" rx="16" fill="white" stroke="#86efac" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="535" y="1285" width="440" height="9" rx="16" fill="#16a34a"/>
<text x="553" y="1319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Scoring Details</text>
<text x="555" y="1347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">• Exclude same-team experts, match skill keys, sort</text>
<text x="555" y="1365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">  descending, return top candidates with matched_skills[].</text>
<rect x="1010" y="1285" width="440" height="95" rx="16" fill="white" stroke="#c4b5fd" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="1010" y="1285" width="440" height="9" rx="16" fill="#7c3aed"/>
<text x="1028" y="1319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Graph Model</text>
<text x="1030" y="1347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">• Engineer, Skill, Team, Bounty nodes with HAS_SKILL,</text>
<text x="1030" y="1365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">  BELONGS_TO, REQUIRES, SOLVED, COLLABORATED_WITH edges.</text>
<rect x="1485" y="1285" width="440" height="95" rx="16" fill="white" stroke="#fda4af" stroke-width="1.4" filter="url(#shadow)"/>
<rect x="1485" y="1285" width="440" height="9" rx="16" fill="#e11d48"/>
<text x="1503" y="1319" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Failure Handling</text>
<text x="1505" y="1347" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">• 400 invalid input, 405 unsupported method, retry/DLQ for</text>
<text x="1505" y="1365" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">  events, circuit-breaker + Redis fallback for Neo4j</text>
<text x="1505" y="1383" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">  latency.</text>
