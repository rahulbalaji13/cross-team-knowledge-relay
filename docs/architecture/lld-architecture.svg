<text x="353" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">ServeMux/API gateway accepts POST, OPTIONS, auth headers, and rate-limits request</text>
