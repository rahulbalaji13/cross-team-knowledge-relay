<text x="883" y="778" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">PostgreSQL stores users, bounties, escrow; Redis stores idempotency/cache/pub-sub keys</text>
<circle cx="582" cy="850" r="17" fill="#d97706"/>
