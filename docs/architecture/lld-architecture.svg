<text x="883" y="1078" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">final score = skill level + recency decay + reputation / centrality signal</text>
<circle cx="847" cy="1150" r="17" fill="#16a34a"/>
<text x="847" y="1156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">10</text>
<line x1="875" y1="1150" x2="1670" y2="1150" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
