<text x="883" y="678" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">MERGE Bounty, Skill, Team, REQUIRES, HAS_SKILL, BELONGS_TO when using Neo4j driver</text>
<circle cx="847" cy="750" r="17" fill="#2563eb"/>
