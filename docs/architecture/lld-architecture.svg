<text x="618" y="878" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Event contains bounty_id, poster_id/team, skills[], ttl, amount, trace_id</text>
