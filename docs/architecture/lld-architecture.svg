<text x="883" y="978" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">MATCH poster team; MATCH bounty → required skills ← experts; filter same team</text>
<circle cx="847" cy="1050" r="17" fill="#d97706"/>
